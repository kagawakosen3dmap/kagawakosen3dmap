<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>360°ビュー（フルスクリーン）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden; /* スクロールバーを消す */
    }
    #panorama {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: 'https://kagawakosen3dmap.github.io/kagawakosen3dmap/一般教育課棟_edit/1-1前.jpg', // ←ここを自分の360度JPGファイルに置き換え
      autoLoad: true,
      autoRotate: -2
    });
  </script>
</body>
</html>
